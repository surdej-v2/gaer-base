name: test
# Python tests against a real Postgres and a typecheck + build of the Vite frontend.
# Runs on pull requests and is reused by deploy.yml.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          # Passwords on loopback too, as on a real server: postgres_fdw refuses a non-superuser
          # user mapping when the server it connects to does not ask for a password.
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Python tests
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          pip install -r server/requirements-dev.txt
          pytest server

      - name: Build frontend
        run: npm ci --prefix web && npm run build --prefix web
